<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="There's blueyo0, nice to meet u~ · I am an AI Infra engineer. I like creating tools for social good, agentic systems, AI-powered healthcare, etc. Tech Otakus make the world better ;)">
  <!--
    Edit freely:
      #title           -> typed greeting (if longer, widen the #typing rect width)
      .s1 / .s2 / .s3  -> rotating slogan lines
      #punch           -> motto
  -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #title { font-size: 26px; font-weight: 700; fill: #e8f3e9; }
    .prompt { font-size: 26px; font-weight: 700; fill: #82d9ae; }
    .s { font-size: 16px; fill: #abc1b3; opacity: 0; }
    #punch { font-size: 30px; font-weight: 700; }
    .path { font-size: 12px; fill: #6b8577; }

    .type { animation: type 2.6s steps(40, end) 0.4s both; }
    @keyframes type { from { width: 0; } to { width: 640px; } }
    .cursor { fill: #82d9ae; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .s1 { animation: cycle 12s ease-in-out 3.2s infinite; }
    .s2 { animation: cycle 12s ease-in-out 7.2s infinite; }
    .s3 { animation: cycle 12s ease-in-out 11.2s infinite; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(6px); }
      5%, 30% { opacity: 1; transform: none; }
      35%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .fade { animation: fade 1s ease-out 3.2s both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .glow { animation: breathe 8s ease-in-out infinite; transform-origin: 640px 90px; }
    @keyframes breathe { 50% { opacity: .55; transform: translate(-30px, 20px) scale(1.15); } }

    .sip { animation: sip 5s ease-in-out infinite; }
    @keyframes sip { 50% { transform: translateY(1.2px); } }
    .ice { animation: bob 4.5s ease-in-out infinite; transform-origin: 735px 225px; }
    @keyframes bob { 50% { transform: translateY(1.5px) rotate(-5deg); } }
    .fizz1 { animation: rise 4.8s ease-out infinite; }
    .fizz2 { animation: rise 4.8s ease-out 2.4s infinite; }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(4px) scale(.7); }
      25% { opacity: .75; }
      75%, 100% { opacity: 0; transform: translateY(-14px) scale(1.05); }
    }
    .negroni { cursor: pointer; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1611"/><stop offset="1" stop-color="#131d18"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#82d9ae" stop-opacity=".22"/>
      <stop offset="1" stop-color="#82d9ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#d94e34" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d94e34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="campari" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e35639" stop-opacity=".92"/>
      <stop offset="1" stop-color="#7d1f14" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#82d9ae"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#82d9ae" fill-opacity=".09"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="800" height="260" rx="14"/></clipPath>
    <clipPath id="typing"><rect class="type" x="74" y="70" height="40" width="640"/></clipPath>
    <clipPath id="glass"><path d="M715 204 L757 204 L752 240 L720 240 Z"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="260" fill="url(#bg)"/>
    <rect width="800" height="260" fill="url(#dots)"/>
    <circle class="glow" cx="640" cy="90" r="220" fill="url(#halo)"/>

    <!-- title bar -->
    <rect width="800" height="34" fill="#0a120e"/>
    <circle cx="22" cy="17" r="5" fill="#3a4a41"/>
    <circle cx="40" cy="17" r="5" fill="#3a4a41"/>
    <circle cx="58" cy="17" r="5" fill="#3a4a41"/>
    <text class="path" x="400" y="21" text-anchor="middle">~/blueyo0</text>

    <!-- greeting -->
    <text class="prompt" x="48" y="98">$</text>
    <g clip-path="url(#typing)"><text id="title" x="74" y="98">There's blueyo0, nice to meet u~<tspan class="cursor">▌</tspan></text></g>

    <!-- slogans -->
    <text class="s s1" x="74" y="140">I am an AI Infra engineer.</text>
    <text class="s s2" x="74" y="140">I like creating tools for social good,</text>
    <text class="s s3" x="74" y="140">agentic systems, AI-powered healthcare, etc.</text>

    <g class="fade">
      <text id="punch" x="48" y="208" fill="url(#ink)">Tech Otakus make the world better ;)</text>
    </g>

    <!-- Negroni, hidden in plain sight -->
    <a href="https://www.dante-nyc.com/wv/#fall-into-dante-copy-1" target="_blank" class="negroni">
      <title>Dante Negroni · Bombay Sapphire, Campari, Martini &amp; Rossi Vermouth — Dante NYC Menu</title>
      <circle cx="736" cy="224" r="52" fill="url(#warm)"/>
      <!-- king ice cube top breaking above surface -->
      <g clip-path="url(#glass)">
        <g class="ice">
          <rect x="724" y="214" width="21" height="21" rx="3" fill="#e8f3e9" fill-opacity=".10" stroke="#a8cbb9" stroke-opacity=".65" stroke-width="1.2" transform="rotate(-11 735 225)"/>
          <path d="M727 218 L739 216" stroke="#ffffff" stroke-opacity=".35" stroke-width="1" stroke-linecap="round"/>
        </g>
        <g class="sip">
          <rect x="712" y="220" width="48" height="22" fill="url(#campari)"/>
          <path d="M715 220 Q736 221.5 757 220" fill="none" stroke="#ff9b80" stroke-opacity=".85" stroke-width="1.4"/>
        </g>
      </g>
      <!-- heavy crystal sham (rocks glass base) -->
      <path d="M720 240 L752 240 L751 245 L721 245 Z" fill="#82d9ae" fill-opacity=".14"/>
      <line x1="723" y1="242.5" x2="749" y2="242.5" stroke="#b9d6c7" stroke-opacity=".45" stroke-width="1" stroke-linecap="round"/>
      <!-- rocks glass body -->
      <path d="M715 204 L757 204 L751 245 L721 245 Z" fill="none" stroke="#85a895" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="718" y1="208" x2="722" y2="237" stroke="#ffffff" stroke-opacity=".22" stroke-width="1" stroke-linecap="round"/>
      <!-- sculpted orange peel twist on rim -->
      <path d="M744 212 C 746 201, 755 198, 761 205 C 763 208, 759 212, 755 210" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M746 210 C 748 202, 755 200, 760 205" fill="none" stroke="#fde68a" stroke-opacity=".65" stroke-width=".9" stroke-linecap="round"/>
      <!-- subtle rising citrus/aroma glints -->
      <circle class="fizz1" cx="732" cy="202" r="1.3" fill="#f59e0b"/>
      <text class="fizz2" x="742" y="199" font-size="8" fill="#82d9ae">✦</text>
    </a>
  </g>
  <rect x=".75" y=".75" width="798.5" height="258.5" rx="14" fill="none" stroke="#1f2e26" stroke-width="1.5"/>
</svg>
