<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Haoyu Wang · Learn, build, revisit.">
  <!--
    Edit the text below freely:
      #title    -> main line
      #subtitle -> second line
      #tags     -> small line at the bottom
  -->
  <style>
    :root { --paper:#f7f7ef; --ink:#17251e; --muted:#486054; --line:#becbbf; --green:#136448; }
    @media (prefers-color-scheme: dark) {
      :root { --paper:#131d18; --ink:#e8f3e9; --muted:#abc1b3; --line:#456152; --green:#82d9ae; }
    }
    .bg    { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
    .ink   { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .green { fill: var(--green); }
    .ring  { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; }
    .ring2 { fill: none; stroke: var(--line); stroke-width: 3; }
    text   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #title    { font-size: 40px; font-weight: 700; }
    #subtitle { font-size: 20px; }
    #tags     { font-size: 14px; letter-spacing: 2px; }

    /* typing reveal */
    .type { animation: type 2.4s steps(22, end) 0.3s both; }
    @keyframes type { from { width: 0; } to { width: 520px; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* fade-in for the lines below */
    .fade1 { animation: fade 0.8s ease-out 2.6s both; }
    .fade2 { animation: fade 0.8s ease-out 3.0s both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* rolling buffer ring */
    .spin { transform-origin: 690px 100px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <defs>
    <clipPath id="typing"><rect class="type" x="60" y="40" height="60" width="520"/></clipPath>
  </defs>

  <rect class="bg" x="1" y="1" width="798" height="198" rx="14"/>

  <g clip-path="url(#typing)">
    <text id="title" class="ink" x="60" y="88">Haoyu Wang</text>
  </g>
  <rect class="green cursor" x="300" y="58" width="14" height="36"/>

  <g class="fade1">
    <text id="subtitle" class="muted" x="60" y="124">Learn, build, revisit.</text>
  </g>
  <g class="fade2">
    <text id="tags" class="green" x="60" y="160">AI COMPILER · AGENTIC SYSTEM · MEDICAL AI</text>
  </g>

  <!-- buffer ring -->
  <circle class="ring2" cx="690" cy="100" r="46"/>
  <g class="spin">
    <circle class="ring" cx="690" cy="100" r="46" stroke-dasharray="72 217"/>
  </g>
  <text class="green" x="690" y="107" text-anchor="middle" font-size="22">↻</text>
</svg>
