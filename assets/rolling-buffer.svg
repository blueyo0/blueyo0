<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="800" height="64" role="img" aria-label="Rolling Buffer · keep what holds, revise what doesn't. read →">
  <!-- Edit #name / #line / #go freely. -->
  <style>
    #name { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-style: italic; fill: #e8f3e9; }
    #line { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #abc1b3; }
    #go   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #82d9ae; }
    .cell { fill: #82d9ae; opacity: .12; animation: fill 4s steps(1, end) infinite; }
    .c2 { animation-delay: .5s; } .c3 { animation-delay: 1s; } .c4 { animation-delay: 1.5s; }
    @keyframes fill { 0% { opacity: .12; } 12%, 75% { opacity: .9; } 76%, 100% { opacity: .12; } }
    .spin { transform-origin: 34px 32px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .nudge { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(4px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1611"/><stop offset="1" stop-color="#131d18"/>
    </linearGradient>
  </defs>

  <rect x=".75" y=".75" width="798.5" height="62.5" rx="10" fill="url(#bg)" stroke="#1f2e26" stroke-width="1.5"/>

  <g class="spin">
    <circle cx="34" cy="32" r="11" fill="none" stroke="#456152" stroke-width="2"/>
    <path d="M34 21 A11 11 0 0 1 45 32" fill="none" stroke="#82d9ae" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text id="name" x="60" y="39">Rolling Buffer</text>

  <rect class="cell c1" x="232" y="24" width="10" height="16" rx="2"/>
  <rect class="cell c2" x="248" y="24" width="10" height="16" rx="2"/>
  <rect class="cell c3" x="264" y="24" width="10" height="16" rx="2"/>
  <rect class="cell c4" x="280" y="24" width="10" height="16" rx="2"/>

  <text id="line" x="314" y="37">keep what holds, revise what doesn't.</text>

  <g class="nudge"><text id="go" x="770" y="37" text-anchor="end">read →</text></g>
</svg>
